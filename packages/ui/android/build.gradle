buildscript {
  ext.getExtOrDefault = { name, fallback ->
    if (rootProject.ext.has(name)) {
      return rootProject.ext.get(name)
    }

    def propertyName = "ZKitUI_${name}"
    return project.hasProperty(propertyName) ? project.property(propertyName) : fallback
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion', '2.0.21')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
  namespace "com.zkit.ui"
  compileSdkVersion getExtOrDefault("compileSdkVersion", 35).toInteger()

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion", 24).toInteger()
    targetSdkVersion getExtOrDefault("targetSdkVersion", 35).toInteger()
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.recyclerview:recyclerview:1.3.2"
}
